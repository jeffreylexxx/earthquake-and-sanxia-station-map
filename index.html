<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="长江三峡及上游重点水坝与地震时空关系交互地图" />
    <title>江震图谱｜三峡与上游水坝地震观察</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-index">YRS / 01</span>
          <div>
            <h1>江震图谱</h1>
            <p>三峡与长江上游重点水坝 · 地震时空观察</p>
          </div>
        </div>
        <div class="topbar-meta" aria-live="polite">
          <span class="pulse-dot" aria-hidden="true"></span>
          <span id="lastUpdated">数据载入中</span>
        </div>
      </header>

      <aside class="control-rail" aria-label="地图筛选">
        <section class="rail-section overview-section">
          <p class="eyebrow">OVERVIEW</p>
          <div class="metric-grid">
            <article><strong id="damCount">—</strong><span>重点水坝</span></article>
            <article><strong id="quakeCount">—</strong><span>地震记录</span></article>
            <article><strong id="recentCount">—</strong><span>近30天新增</span></article>
            <article><strong id="maxMagnitude">—</strong><span>最大震级</span></article>
          </div>
        </section>

        <section class="rail-section">
          <div class="section-heading">
            <p class="eyebrow">LAYERS</p>
            <button class="text-button" id="resetFilters" type="button">重置</button>
          </div>
          <label class="switch-row">
            <span><i class="legend-mark dam-mark"></i>重点水坝</span>
            <input id="toggleDams" type="checkbox" checked />
          </label>
          <label class="switch-row">
            <span><i class="legend-mark quake-mark"></i>地震记录</span>
            <input id="toggleQuakes" type="checkbox" checked />
          </label>
          <label class="switch-row">
            <span><i class="legend-mark recent-mark"></i>近30天高亮</span>
            <input id="toggleRecent" type="checkbox" checked />
          </label>
          <label class="switch-row">
            <span><i class="legend-line"></i>重要水道</span>
            <input id="toggleWaterways" type="checkbox" checked />
          </label>
        </section>

        <section class="rail-section filters-section">
          <p class="eyebrow">FILTERS</p>
          <label class="field-label" for="magnitudeRange">
            <span>最低震级</span><output id="magnitudeValue">3.0</output>
          </label>
          <input id="magnitudeRange" type="range" min="3" max="7" step="0.1" value="3" />

          <label class="field-label" for="depthRange">
            <span>最大深度</span><output id="depthValue">100 km</output>
          </label>
          <input id="depthRange" type="range" min="5" max="300" step="5" value="100" />

          <label class="field-label" for="yearSelect"><span>起始年份</span></label>
          <select id="yearSelect" aria-label="起始年份">
            <option value="all">全部记录</option>
          </select>

          <label class="field-label" for="basinSelect"><span>水系分组</span></label>
          <select id="basinSelect" aria-label="水系分组">
            <option value="all">全部水系</option>
          </select>
        </section>

        <section class="rail-section note-section">
          <p class="eyebrow">READING NOTE</p>
          <p>本图展示时间与空间关系，不据此推断水库建设或运行导致地震。</p>
        </section>
      </aside>

      <section class="map-stage" aria-label="交互地图">
        <div id="map"></div>
        <div class="map-caption">
          <span>震级</span>
          <i class="size-dot sm"></i><small>3</small>
          <i class="size-dot md"></i><small>5</small>
          <i class="size-dot lg"></i><small>7+</small>
          <span class="caption-separator"></span>
          <span>深度</span>
          <i class="depth-swatch shallow"></i><small>浅</small>
          <i class="depth-swatch deep"></i><small>深</small>
        </div>
        <button class="mobile-filter-button" id="mobileFilterButton" type="button">筛选与图层</button>
      </section>

      <aside class="detail-drawer" id="detailDrawer" aria-label="地点详情" aria-hidden="true">
        <button class="drawer-close" id="drawerClose" type="button" aria-label="关闭详情">×</button>
        <p class="eyebrow" id="detailType">DETAIL</p>
        <h2 id="detailTitle">选择地图上的地点</h2>
        <p class="detail-kicker" id="detailKicker"></p>
        <div id="detailBody" class="detail-body"></div>
      </aside>

      <div class="loading-screen" id="loadingScreen" role="status">
        <div class="loading-line"></div>
        <p>正在读取水坝与地震资料</p>
      </div>
    </main>

    <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
    <script src="./app.js" defer></script>
  </body>
</html>
