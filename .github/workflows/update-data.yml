name: Update earthquake data

on:
  schedule:
    # 每天北京时间 05:17（UTC 21:17）运行，避开整点拥堵。
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: earthquake-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch revised and new earthquakes
        env:
          EARTHQUAKE_BOOTSTRAP_START: "2016-08-30T00:00:00Z"
        run: python scripts/update_earthquakes.py

      - name: Validate data and refresh metadata
        run: python scripts/validate_data.py

      - name: Package current site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Commit changed data
        shell: bash
        run: |
          if git diff --quiet -- data/earthquakes.geojson data/metadata.json; then
            echo "No earthquake catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earthquakes.geojson data/metadata.json
          git commit -m "data: update earthquake catalog"
          git push

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Deploy refreshed data to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
